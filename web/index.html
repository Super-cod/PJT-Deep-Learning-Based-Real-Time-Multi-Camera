<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spatial Relay | World View</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/world.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/three.module.js",
        "three/addons/": "/vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="scene"></div>

  <header class="bar">
    <div class="brand">SPATIAL RELAY <span>WORLD VIEW</span></div>
    <div id="hubStatus" class="pill">CONNECTING</div>
  </header>

  <aside class="panel">
    <section>
      <h2>View</h2>
      <div class="row" id="viewButtons">
        <button data-view="orbit" class="active">Orbit</button>
        <button data-view="top">Top-down</button>
      </div>
      <div class="row" id="followButtons"></div>
      <label class="slider">Wall opacity
        <input id="wallOpacity" type="range" min="0.05" max="0.9" step="0.05" value="0.22">
      </label>
      <label class="check"><input id="showObjects" type="checkbox" checked> Furniture</label>
      <label class="check"><input id="showSight" type="checkbox" checked> Sight lines</label>
    </section>

    <section>
      <h2>Phones <span id="deviceCount" class="count">0</span></h2>
      <ul id="devices" class="list"><li class="empty">No phones connected</li></ul>
    </section>

    <section>
      <h2>People <span id="peopleCount" class="count">0</span></h2>
      <ul id="people" class="list"><li class="empty">Nobody detected</li></ul>
    </section>

    <section>
      <h2>Room model</h2>
      <p id="roomInfo" class="muted">No room scanned yet. On a LiDAR iPhone tap <b>Scan rooms</b>, then <b>Save &amp; share</b>.</p>
    </section>

    <p class="legend">
      <i class="solid"></i> phone sees person
      <i class="dashed"></i> person is <b>behind a wall</b> from that phone
    </p>
  </aside>

  <script type="module" src="/world.js"></script>
</body>
</html>
